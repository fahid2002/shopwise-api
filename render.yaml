services:
  - type: web
    name: shopwise-api
    env: node
    plan: starter
    buildCommand: npm install && npm run build && npm run prisma:deploy
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: shopwise-db
          property: connectionString

databases:
  - name: shopwise-db
    plan: starter
